# Orodruin — nginx reverse proxy.
# Serves the built frontend (frontend/dist) and proxies /api to the FastAPI backend.
# Put this in /etc/nginx/sites-available/orodruin, symlink into sites-enabled,
# then run certbot for TLS:  sudo certbot --nginx -d orodruin.dev -d www.orodruin.dev
#
# Adjust ORODRUIN_ROOT to where you cloned the repo.

server {
    listen 80;
    listen [::]:80;
    server_name orodruin.dev www.orodruin.dev;

    # Built SPA
    root /opt/orodruin/frontend/dist;
    index index.html;

    # Static assets — long cache (Vite fingerprints filenames)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SEO / crawl files
    location = /robots.txt   { try_files $uri =404; }
    location = /sitemap.xml  { try_files $uri =404; }

    # API -> FastAPI (uvicorn on :8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket support (AIS stream, if proxied)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    # SPA fallback — every other path serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Upload / response size headroom for tiles
    client_max_body_size 8m;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
}
