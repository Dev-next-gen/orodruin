      #splash .sp-bar i{display:block;height:100%;width:0;background:#45c8e0;border-radius:2px;box-shadow:0 0 8px #45c8e0;animation:sp-load 2.7s ease-in-out forwards}
      #splash .sp-skip{position:absolute;bottom:26px;font:500 10px/1 system-ui,sans-serif;letter-spacing:.2em;color:#3a4756;text-transform:uppercase}
      @keyframes sp-pop{0%{opacity:0;transform:scale(.7)}100%{opacity:1;transform:scale(1)}}
      @keyframes sp-rot{to{transform:rotate(360deg)}}
      @keyframes sp-pulse{0%{opacity:.55;transform:scale(.58)}100%{opacity:0;transform:scale(1.3)}}
      @keyframes sp-fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
      @keyframes sp-load{0%{width:0}100%{width:100%}}
      @media (prefers-reduced-motion:reduce){#splash .sp-scan,#splash .sp-ring,#splash .sp-bar i{animation:none}}
    </style>
